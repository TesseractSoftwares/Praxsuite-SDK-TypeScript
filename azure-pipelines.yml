# Praxsuite SDK for TypeScript - validate, package, and mirror to GitHub
#
# PR and development: validate only.
# master:             validate, package a .tgz, mirror the source to the public GitHub repo,
#                     and cut a GitHub Release carrying the tarball.
#
# Validation typechecks, builds and runs the offline suite - 45 tests, no network and no
# workspace needed. They mirror the shared SDK conformance contract.

# There is deliberately no paths: exclude here. Excluding README.md looks like an easy saving,
# but the mirror-to-GitHub step in this pipeline IS how the public repo gets updated - so a
# documentation-only change would never reach a single reader. Running the suite for a typo fix is
# the cheaper mistake.
trigger:
  branches:
    include:
      - master
      - development

pr:
  branches:
    include:
      - master
      - development

pool:
  name: tesseract-buildpool

variables:
  buildConfiguration: 'Release'
  isMaster: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]
  githubRepo: 'TesseractSoftwares/Praxsuite-SDK-TypeScript'

stages:

# ─────────────────────────────────────────────────────────────────────────────
- stage: Validate
  displayName: 'Build and test'
  jobs:
    - job: Validate
      steps:
        - task: NodeTool@0
          displayName: 'Install Node'
          inputs:
            versionSpec: '22.x'

        - script: npm ci
          displayName: 'Install'

        - script: npm run typecheck
          displayName: 'Typecheck'

        - script: npm test
          displayName: 'Test'

        - script: npm run build
          displayName: 'Build'

        # This repo is mirrored to a PUBLIC GitHub repo, so hold it to the same standard as the
        # other SDKs: no secret keys, and no real workspace identifiers. A workspace GUID is not
        # cosmetic - /auth/config is unauthenticated, so a GUID alone fetches that workspace's
        # publishable key.
        - script: |
            set -e
            if grep -rEn 'sk_live_[A-Za-z0-9]{16,}'                  --include='*.ts' --include='*.js' --include='*.json' --include='*.md'                  --include='*.yml' --exclude-dir=node_modules --exclude-dir=dist                  --exclude-dir=.git . ; then
              echo "##vso[task.logissue type=error]A Praxsuite secret key is present. Revoke it now - this repo is mirrored publicly."
              exit 1
            fi
            echo "No secret keys found."
          displayName: 'Scan for leaked secret keys'

# ─────────────────────────────────────────────────────────────────────────────
- stage: Publish
  displayName: 'Package and mirror to GitHub'
  dependsOn: Validate
  condition: and(succeeded(), eq(variables.isMaster, true))
  jobs:
    - job: Publish
      steps:
        # Full history: the mirror push needs real commits, not a shallow clone.
        - checkout: self
          fetchDepth: 0
          persistCredentials: true

        - task: NodeTool@0
          displayName: 'Install Node'
          inputs:
            versionSpec: '22.x'

        - task: AzureKeyVault@2
          displayName: 'Read publish secrets'
          inputs:
            azureSubscription: 'sc-acr-push-core-prod'
            KeyVaultName: 'prax-cicd-kv'
            SecretsFilter: 'GITHUB-SDK-MIRROR-TOKEN,NPM-PUBLISH-TOKEN'
            RunAsPreJob: false

        # package.json is the single source of truth for the release tag, so a release can
        # never silently disagree with the version consumers actually install.
        - script: |
            set -e
            VERSION=$(node -p "require('./package.json').version")
            if [ -z "$VERSION" ]; then
              echo "##vso[task.logissue type=error]package.json has no version field."
              exit 1
            fi
            echo "Package version: $VERSION"
            echo "##vso[task.setvariable variable=pkgVersion]$VERSION"
          displayName: 'Read package version'

        # The build MUST happen here. This stage is a fresh checkout with no node_modules and no
        # dist/, and package.json's "files" lists dist - so npm pack silently produced a tarball
        # containing only README, LICENSE, SECURITY and package.json. The v1.0.0 release asset
        # shipped exactly that: 7 KB with no code in it, and the build stayed green because a
        # missing directory is not an error to npm pack.
        - script: |
            set -e
            npm ci
            npm run build
            test -f dist/index.js || {
              echo "##vso[task.logissue type=error]dist/index.js is missing after the build."
              exit 1
            }
          displayName: 'Install and build'

        - script: |
            set -e
            npm pack
            mkdir -p "$(Build.ArtifactStagingDirectory)/package"
            mv ./*.tgz "$(Build.ArtifactStagingDirectory)/package/"
            TGZ=$(ls "$(Build.ArtifactStagingDirectory)/package/"*.tgz | head -1)
            ls -la "$(Build.ArtifactStagingDirectory)/package/"

            # Assert the tarball actually CONTAINS the library. Checking that an artifact exists
            # is not the same as checking it is usable - the empty v1.0.0 tarball passed every
            # other gate in this pipeline.
            JS=$(tar -tzf "$TGZ" | grep -c 'package/dist/.*\.js$' || true)
            DTS=$(tar -tzf "$TGZ" | grep -c 'package/dist/.*\.d\.ts$' || true)
            echo "Tarball carries $JS .js and $DTS .d.ts files."
            if [ "$JS" -lt 5 ] || [ "$DTS" -lt 5 ]; then
              echo "##vso[task.logissue type=error]The tarball does not contain the built library. Contents:"
              tar -tzf "$TGZ"
              exit 1
            fi
            echo "##vso[task.setvariable variable=pkgTarball]$TGZ"
          displayName: 'Pack tarball'

        - task: PublishBuildArtifacts@1
          displayName: 'Publish tarball artifact'
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)/package'
            ArtifactName: 'package'

        # The mirror must not overwrite history it does not contain. --force-with-lease was used
        # here, preceded by a fetch, which cannot protect anything: fetching sets the
        # remote-tracking ref to whatever GitHub currently has, so the lease always matches and
        # the push always wins. It silently reset commits pushed straight to a sibling SDK's
        # mirror, twice.
        - script: |
            set -e
            git config user.email "ci@tesseractsoftwares.com"
            git config user.name  "Tesseract CI"

            git remote remove github 2>/dev/null || true
            git remote add github "https://x-access-token:$(GITHUB-SDK-MIRROR-TOKEN)@github.com/$(githubRepo).git"
            # Read the mirror's head BEFORE fetching, so the check is against what GitHub
            # actually has rather than against a ref the fetch just overwrote.
            REMOTE_SHA=$(git ls-remote github refs/heads/master | cut -f1)
            if [ -n "$REMOTE_SHA" ]; then
              git fetch github master
              if ! git merge-base --is-ancestor "$REMOTE_SHA" HEAD; then
                echo "##vso[task.logissue type=error]github.com/$(githubRepo) is at $REMOTE_SHA, which is not an ancestor of this build. Someone pushed to the mirror directly. Reconcile it - do not overwrite."
                exit 1
              fi
            fi

            echo "Mirroring master to github.com/$(githubRepo)"
            if ! git push github HEAD:refs/heads/master; then
              echo "##vso[task.logissue type=error]Mirror push failed. Check the token has contents:write on the mirror."
              exit 1
            fi
            echo "Mirror complete."
          displayName: 'Mirror source to GitHub'

        # Idempotent: an existing tag is a no-op, so re-running a build never fails.
        - script: |
            set -e
            TAG="v$(pkgVersion)"
            API="https://api.github.com/repos/$(githubRepo)"
            AUTH="Authorization: Bearer $(GITHUB-SDK-MIRROR-TOKEN)"

            # "Already exists" is not on its own good enough to report success. A release
            # created by a run that then failed its upload has no asset, and an early exit here
            # would report green forever while nobody could download anything - the exact failure
            # the verification at the end of this step exists to catch, skipped by the shortcut
            # above it. Praxsuite-SDK-Lua has a stale 0.1 tag in that state.
            if curl -sSf -o /tmp/existing.json -H "$AUTH" "$API/releases/tags/$TAG" 2>/dev/null; then
              if grep -q '"state": *"uploaded"' /tmp/existing.json; then
                echo "Release $TAG already exists with an asset attached - nothing to publish."
                exit 0
              fi
              echo "##vso[task.logissue type=error]Release $TAG exists but has no asset attached. A previous run created it and failed to upload. Delete the release (or attach the asset by hand) and re-run."
              exit 1
            fi

            RELEASE=$(curl -sSf -X POST -H "$AUTH" "$API/releases"               -d "{\"tag_name\":\"$TAG\",\"name\":\"Praxsuite SDK for TypeScript $(pkgVersion)\",\"body\":\"Install: npm install @praxsuite/sdk  --  see CHANGELOG.md\",\"draft\":false,\"prerelease\":false}")

            RELEASE_ID=$(echo "$RELEASE" | grep -o '"id": *[0-9]*' | head -1 | tr -dc '0-9')
            if [ -z "$RELEASE_ID" ]; then
              echo "##vso[task.logissue type=error]Could not read the release id from the GitHub response."
              exit 1
            fi
            TGZ=$(ls "$(Build.ArtifactStagingDirectory)/package/"*.tgz | head -1)

            curl -sSf -X POST -H "$AUTH" -H "Content-Type: application/gzip"               --data-binary @"$TGZ"               "https://uploads.github.com/repos/$(githubRepo)/releases/$RELEASE_ID/assets?name=${TGZ##*/}"

            # Verify rather than trust: assert the asset is actually attached. The first
            # release cut by this pipeline reported success while uploading nothing.
            ASSETS=$(curl -sSf -H "$AUTH" "$API/releases/tags/$TAG" | grep -c '"state": *"uploaded"' || true)
            if [ "$ASSETS" -lt 1 ]; then
              echo "##vso[task.logissue type=error]Release $TAG was created but no asset attached. Check the upload URL and the asset name."
              exit 1
            fi

            echo "Published release $TAG with $ASSETS asset(s)"
          displayName: 'Cut GitHub release'

        # Publishing to npm comes LAST, deliberately. It is the only step here that cannot be
        # undone: npm forbids re-publishing a version even after unpublishing it, so a bad publish
        # burns the version number permanently. Everything that can fail should have failed by now.
        #
        # No --provenance: it needs OIDC from GitHub Actions or GitLab, which Azure DevOps cannot
        # supply. That is also why this uses a granular token rather than Trusted Publishing.
        - script: |
            set -e
            PKG="@praxsuite/sdk"

            # Idempotent: a re-run of the same commit must not fail.
            if npm view "$PKG@$(pkgVersion)" version >/dev/null 2>&1; then
              echo "$PKG@$(pkgVersion) is already on the registry - nothing to publish."
              exit 0
            fi

            # Auth via a workspace-local .npmrc rather than `npm login`. It is gitignored, and
            # removed in the trap below whatever happens.
            trap 'rm -f "$(Build.SourcesDirectory)/.npmrc"' EXIT
            printf '//registry.npmjs.org/:_authToken=%s\n' "$(NPM-PUBLISH-TOKEN)" > "$(Build.SourcesDirectory)/.npmrc"

            # --access public because a scoped package defaults to restricted, and a free org
            # cannot host a private package - it would fail with a 402 that reads like a billing
            # problem rather than a config one.
            npm publish "$(pkgTarball)" --access public

            # Verify from the registry rather than trusting the exit code, and confirm the
            # published tarball is the one carrying the build.
            sleep 5
            PUBLISHED=$(npm view "$PKG@$(pkgVersion)" dist.unpackedSize 2>/dev/null || echo 0)
            echo "Registry reports unpackedSize=$PUBLISHED for $PKG@$(pkgVersion)"
            if [ "${PUBLISHED:-0}" -lt 20000 ]; then
              echo "##vso[task.logissue type=error]$PKG@$(pkgVersion) published but looks empty (unpackedSize=$PUBLISHED). The v1.0.0 release asset failed exactly this way."
              exit 1
            fi
            echo "Published $PKG@$(pkgVersion) to npm."
          displayName: 'Publish to npm'
