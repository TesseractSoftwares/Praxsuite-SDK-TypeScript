# Praxsuite SDK for TypeScript - validate, package, and mirror to GitHub
#
# PR and development: validate only.
# master:             validate, package a .tgz, mirror the source to the public GitHub repo,
#                     and cut a GitHub Release carrying the tarball.
#
# Validation typechecks, builds and runs the offline suite - 45 tests, no network and no
# workspace needed. They mirror the shared SDK conformance contract.

trigger:
  branches:
    include:
      - master
      - development
  paths:
    exclude:
      - README.md
      - CHANGELOG.md
      - docs/*

pr:
  branches:
    include:
      - master
      - development

pool:
  name: tesseract-buildpool

variables:
  buildConfiguration: 'Release'
  isMaster: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]
  githubRepo: 'TesseractSoftwares/Praxsuite-SDK-TypeScript'

stages:

# ─────────────────────────────────────────────────────────────────────────────
- stage: Validate
  displayName: 'Build and test'
  jobs:
    - job: Validate
      steps:
        - task: NodeTool@0
          displayName: 'Install Node'
          inputs:
            versionSpec: '22.x'

        - script: npm ci
          displayName: 'Install'

        - script: npm run typecheck
          displayName: 'Typecheck'

        - script: npm test
          displayName: 'Test'

        - script: npm run build
          displayName: 'Build'

        # This repo is mirrored to a PUBLIC GitHub repo, so hold it to the same standard as the
        # other SDKs: no secret keys, and no real workspace identifiers. A workspace GUID is not
        # cosmetic - /auth/config is unauthenticated, so a GUID alone fetches that workspace's
        # publishable key.
        - script: |
            set -e
            if grep -rEn 'sk_live_[A-Za-z0-9]{16,}'                  --include='*.ts' --include='*.js' --include='*.json' --include='*.md'                  --include='*.yml' --exclude-dir=node_modules --exclude-dir=dist                  --exclude-dir=.git . ; then
              echo "##vso[task.logissue type=error]A Praxsuite secret key is present. Revoke it now - this repo is mirrored publicly."
              exit 1
            fi
            echo "No secret keys found."
          displayName: 'Scan for leaked secret keys'

# ─────────────────────────────────────────────────────────────────────────────
- stage: Publish
  displayName: 'Package and mirror to GitHub'
  dependsOn: Validate
  condition: and(succeeded(), eq(variables.isMaster, true))
  jobs:
    - job: Publish
      steps:
        # Full history: the mirror push needs real commits, not a shallow clone.
        - checkout: self
          fetchDepth: 0
          persistCredentials: true

        - task: AzureKeyVault@2
          displayName: 'Read GitHub token'
          inputs:
            azureSubscription: 'sc-acr-push-core-prod'
            KeyVaultName: 'prax-cicd-kv'
            SecretsFilter: 'GITHUB-SDK-MIRROR-TOKEN'
            RunAsPreJob: false

        # package.json is the single source of truth for the release tag, so a release can
        # never silently disagree with the version consumers actually install.
        - script: |
            set -e
            VERSION=$(node -p "require('./package.json').version")
            if [ -z "$VERSION" ]; then
              echo "##vso[task.logissue type=error]package.json has no version field."
              exit 1
            fi
            echo "Package version: $VERSION"
            echo "##vso[task.setvariable variable=pkgVersion]$VERSION"
          displayName: 'Read package version'

        - script: |
            set -e
            npm pack
            mkdir -p "$(Build.ArtifactStagingDirectory)/package"
            mv ./*.tgz "$(Build.ArtifactStagingDirectory)/package/"
            ls -la "$(Build.ArtifactStagingDirectory)/package/"
          displayName: 'Pack tarball'

        - task: PublishBuildArtifacts@1
          displayName: 'Publish tarball artifact'
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)/package'
            ArtifactName: 'package'

        # --force-with-lease, not --force: if someone pushed to GitHub directly, fail loudly
        # rather than destroy their commit.
        - script: |
            set -e
            git config user.email "ci@tesseractsoftwares.com"
            git config user.name  "Tesseract CI"

            git remote remove github 2>/dev/null || true
            git remote add github "https://x-access-token:$(GITHUB-SDK-MIRROR-TOKEN)@github.com/$(githubRepo).git"
            git fetch github master || true

            echo "Mirroring master to github.com/$(githubRepo)"
            if ! git push github HEAD:refs/heads/master --force-with-lease; then
              echo "##vso[task.logissue type=error]Mirror push rejected: GitHub has commits this repo does not. Reconcile them rather than forcing."
              exit 1
            fi
            echo "Mirror complete."
          displayName: 'Mirror source to GitHub'

        # Idempotent: an existing tag is a no-op, so re-running a build never fails.
        - script: |
            set -e
            TAG="v$(pkgVersion)"
            API="https://api.github.com/repos/$(githubRepo)"
            AUTH="Authorization: Bearer $(GITHUB-SDK-MIRROR-TOKEN)"

            if curl -sf -H "$AUTH" "$API/releases/tags/$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists - nothing to publish."
              exit 0
            fi

            RELEASE=$(curl -sf -X POST -H "$AUTH" "$API/releases"               -d "{\"tag_name\":\"$TAG\",\"name\":\"Praxsuite SDK for TypeScript $(pkgVersion)\",\"body\":\"Install: npm install @praxsuite/sdk  --  see CHANGELOG.md\",\"draft\":false,\"prerelease\":false}")

            RELEASE_ID=$(echo "$RELEASE" | head -5 | grep -m1 '"id"' | sed 's/[^0-9]//g')
            TGZ=$(ls "$(Build.ArtifactStagingDirectory)/package/"*.tgz | head -1)

            curl -sf -X POST -H "$AUTH" -H "Content-Type: application/gzip"               --data-binary @"$TGZ"               "https://uploads.github.com/repos/$(githubRepo)/releases/$RELEASE_ID/assets?name=$(basename $TGZ)" >/dev/null

            echo "Published release $TAG"
          displayName: 'Cut GitHub release'
