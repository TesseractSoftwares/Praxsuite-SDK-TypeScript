# Expone secretos del grupo de variables `secretos-ci` (Library de ADO) como
# variables SECRETAS del pipeline, con el nombre que ya usan los pasos de mas
# abajo. Asi ninguna referencia $(...) cambia.
#
# Hasta el 26-11-2026 esta plantilla leia Secret Manager de GCP con la llave de
# ado-deployer. Al cerrar GCP los valores se copiaron a `secretos-ci`, con el
# mismo nombre que tenian en Secret Manager. El archivo conserva su nombre para
# no tocar a quienes lo incluyen.
#
# El pipeline debe enlazar el grupo (`variables: - group: secretos-ci`).
# Igual que antes, falla si un nombre no existe: ADO deja el texto `$(nombre)`
# sin reemplazar y el paso lo detecta.
parameters:
  # Mapa: nombre de la variable en el pipeline -> nombre de la variable en secretos-ci.
  - name: secretos
    type: object

steps:
  - ${{ each par in parameters.secretos }}:
    - script: |
        set -euo pipefail
        # Partido en dos para que ADO no lo reemplace como macro.
        SIN_RESOLVER='$''(${{ par.value }})'
        if [ -z "${VALOR:-}" ] || [ "$VALOR" = "$SIN_RESOLVER" ]; then
          echo "##vso[task.logissue type=error]Falta ${{ par.value }} en el grupo secretos-ci, o el pipeline no enlaza el grupo."
          exit 1
        fi
        # issecret=true: el valor queda enmascarado en los logs del pipeline.
        echo "##vso[task.setvariable variable=${{ par.key }};issecret=true]$VALOR"
      displayName: 'Leer ${{ par.value }}'
      env:
        VALOR: $(${{ par.value }})
