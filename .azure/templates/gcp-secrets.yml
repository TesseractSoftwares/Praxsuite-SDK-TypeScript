# Trae secretos desde Secret Manager de GCP y los expone como variables SECRETAS
# del pipeline, con el mismo nombre que tenian en Key Vault. Asi ninguna
# referencia $(...) de mas abajo cambia al migrar.
#
# Reemplaza a la tarea AzureKeyVault@2 contra prax-cicd-kv, que vive en la
# suscripcion de Azure bloqueada el 2026-09-15. Los 46 secretos de ese vault ya
# estaban replicados en Secret Manager desde el 2026-09-09, asi que la fuente
# unica de verdad es GCP.
#
# CAMBIO DE COMPORTAMIENTO respecto de Key Vault: AzureKeyVault@2 fallaba la
# tarea cuando un nombre del filtro no existia. Aqui tambien falla, porque
# `gcloud secrets versions access` devuelve error y hay `set -euo pipefail`.
#
# La credencial se borra al final, pase lo que pase: el agente es compartido
# entre pipelines y no debe sobrevivir al job.
parameters:
  # Mapa: nombre de la variable en el pipeline -> nombre del secreto en GCP.
  - name: secretos
    type: object

steps:
  - script: |
      set -euo pipefail
      if [ -z "${GCP_SA_KEY_B64:-}" ]; then
        echo "##vso[task.logissue type=error]Falta GCP_SA_KEY_B64. Revisa que el grupo gcp-migration este enlazado al pipeline."
        exit 1
      fi
      printf '%s' "$GCP_SA_KEY_B64" | base64 -d > "$(Agent.TempDirectory)/gcp-key.json"
      gcloud auth activate-service-account --key-file="$(Agent.TempDirectory)/gcp-key.json" --quiet
      gcloud config set project "$(gcpProject)" --quiet
    displayName: 'Autenticar en GCP'
    env:
      GCP_SA_KEY_B64: $(GCP_SA_KEY_B64)

  - ${{ each par in parameters.secretos }}:
    - script: |
        set -euo pipefail
        VALOR=$(gcloud secrets versions access latest --secret="${{ par.value }}" --project="$(gcpProject)")
        if [ -z "$VALOR" ]; then
          echo "##vso[task.logissue type=error]El secreto ${{ par.value }} vino vacio."
          exit 1
        fi
        # issecret=true: el valor queda enmascarado en los logs del pipeline.
        echo "##vso[task.setvariable variable=${{ par.key }};issecret=true]$VALOR"
      displayName: 'Leer ${{ par.value }}'
